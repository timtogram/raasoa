{% extends "base.html" %}
{% block title %}Dependency Graph - RAASOA{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-gray-900 mb-2">Dependency Graph</h1>
<p class="text-sm text-gray-500 mb-4">Documents linked by shared claims, conflicts, or detected contradictions.</p>

<div class="flex items-center gap-4 mb-4">
    <label class="text-sm">Min predicate similarity:
        <input id="sim-input" type="number" min="0" max="1" step="0.05" value="0.5"
               class="border rounded px-2 py-1 text-sm w-20">
    </label>
    <button id="reload-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1 rounded">Reload</button>
    <span id="stats" class="text-xs text-gray-500"></span>
</div>

<div id="graph" class="bg-white border rounded-lg" style="height: 600px;"></div>

<div class="mt-4 text-xs text-gray-500 flex gap-4">
    <span><span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-1"></span>agreement</span>
    <span><span class="inline-block w-3 h-3 bg-red-500 rounded-full mr-1"></span>contradiction</span>
    <span><span class="inline-block w-3 h-3 bg-orange-500 rounded-full mr-1"></span>conflict</span>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
async function loadGraph() {
    const sim = document.getElementById('sim-input').value;
    const resp = await fetch(`/dashboard/graph/data?min_similarity=${sim}`);
    const data = await resp.json();

    document.getElementById('stats').textContent =
        `${data.nodes.length} documents, ${data.edges.length} edges`;

    const container = document.getElementById('graph');
    container.innerHTML = '';
    const W = container.clientWidth, H = 600;
    const svg = d3.select('#graph').append('svg')
        .attr('width', W).attr('height', H);

    const linkColor = d => ({
        agreement: '#10b981',
        contradiction: '#ef4444',
        conflict: '#f97316',
    }[d.type] || '#9ca3af');

    const sim_force = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.edges).id(d => d.id).distance(80))
        .force('charge', d3.forceManyBody().strength(-150))
        .force('center', d3.forceCenter(W / 2, H / 2));

    const link = svg.append('g').selectAll('line')
        .data(data.edges).enter().append('line')
        .attr('stroke', linkColor)
        .attr('stroke-width', d => 1 + (d.similarity || 0) * 2)
        .attr('stroke-opacity', 0.6);

    const node = svg.append('g').selectAll('circle')
        .data(data.nodes).enter().append('circle')
        .attr('r', 8)
        .attr('fill', d => d.quality && d.quality >= 0.8 ? '#10b981'
                          : d.quality && d.quality >= 0.5 ? '#facc15'
                          : '#9ca3af')
        .attr('stroke', '#fff').attr('stroke-width', 1.5)
        .style('cursor', 'pointer')
        .on('click', (e, d) => window.location.href = `/dashboard/documents/${d.id}`)
        .call(d3.drag()
            .on('start', (e, d) => { if (!e.active) sim_force.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
            .on('end', (e, d) => { if (!e.active) sim_force.alphaTarget(0); d.fx = null; d.fy = null; }));

    node.append('title').text(d => `${d.title}\nQuality: ${d.quality ?? 'n/a'}\nStatus: ${d.review_status}`);

    const label = svg.append('g').selectAll('text')
        .data(data.nodes).enter().append('text')
        .text(d => (d.title || '').substring(0, 30))
        .attr('font-size', '10px').attr('fill', '#374151').attr('dx', 10).attr('dy', 4);

    sim_force.on('tick', () => {
        link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        node.attr('cx', d => d.x).attr('cy', d => d.y);
        label.attr('x', d => d.x).attr('y', d => d.y);
    });
}

document.getElementById('reload-btn').addEventListener('click', loadGraph);
loadGraph();
</script>
{% endblock %}
