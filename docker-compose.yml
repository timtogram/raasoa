services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raasoa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raasoa_dev}
      POSTGRES_DB: ${POSTGRES_DB:-raasoa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raasoa}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    platform: linux/amd64
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-raasoa}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-raasoa_dev}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    platform: linux/amd64
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # The ollama image ships no curl/wget — use the bundled CLI, which
      # exits 0 only when the server is reachable.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # Pull embedding + chat models on first start, then exit
  ollama-pull:
    image: ollama/ollama:latest
    platform: linux/amd64
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text} &&
        ollama pull ${OLLAMA_CHAT_MODEL:-qwen3:8b} &&
        echo "Models ready"
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  # RAASOA API — starts automatically with `docker compose up -d`
  #
  # SECURITY: the defaults below (AUTH_ENABLED=false, CORS_ORIGINS unset)
  # are meant for local/self-hosted use on a trusted network — matching
  # the README's "cp .env.example .env && docker compose up -d" quickstart,
  # where the dashboard's Load Demo Data button must work with no login
  # step. Before exposing this on the public internet, set in .env:
  #   AUTH_ENABLED=true, DASHBOARD_PASSWORD=<strong password>,
  #   CORS_ORIGINS=https://your-frontend.example.com, SIGNUP_ENABLED=false
  api:
    build: .
    platform: linux/amd64
    image: raasoa:latest
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-raasoa}:${POSTGRES_PASSWORD:-raasoa_dev}@postgres:5432/${POSTGRES_DB:-raasoa}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-30}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-raasoa}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-raasoa_dev}
      S3_BUCKET: ${S3_BUCKET:-raasoa-artifacts}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      CHUNK_SIZE: ${CHUNK_SIZE:-512}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-80}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      QUALITY_GATE_ENABLED: ${QUALITY_GATE_ENABLED:-true}
      QUALITY_MIN_TEXT_LENGTH: ${QUALITY_MIN_TEXT_LENGTH:-50}
      QUALITY_PUBLISH_THRESHOLD: ${QUALITY_PUBLISH_THRESHOLD:-0.8}
      QUALITY_REVIEW_THRESHOLD: ${QUALITY_REVIEW_THRESHOLD:-0.5}
      QUALITY_MAX_TINY_CHUNK_RATIO: ${QUALITY_MAX_TINY_CHUNK_RATIO:-0.3}
      QUALITY_TINY_CHUNK_TOKENS: ${QUALITY_TINY_CHUNK_TOKENS:-20}
      CONFLICT_DETECTION_ENABLED: ${CONFLICT_DETECTION_ENABLED:-true}
      CONFLICT_SEMANTIC_THRESHOLD: ${CONFLICT_SEMANTIC_THRESHOLD:-0.15}
      CONFLICT_OVERLAP_THRESHOLD: ${CONFLICT_OVERLAP_THRESHOLD:-0.3}
      CLAIM_EXTRACTION_ENABLED: ${CLAIM_EXTRACTION_ENABLED:-true}
      CLAIM_EXTRACTION_PASSES: ${CLAIM_EXTRACTION_PASSES:-1}
      LLM_JUDGE_ENABLED: ${LLM_JUDGE_ENABLED:-true}
      LLM_JUDGE_AUTO_RESOLVE_THRESHOLD: ${LLM_JUDGE_AUTO_RESOLVE_THRESHOLD:-0.85}
      LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL:-}
      RERANKER: ${RERANKER:-passthrough}
      INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-30}
      RETRIEVE_RATE_LIMIT_PER_MINUTE: ${RETRIEVE_RATE_LIMIT_PER_MINUTE:-120}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      API_KEYS: ${API_KEYS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-true}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MCP_HTTP_ENABLED: ${MCP_HTTP_ENABLED:-true}
      MCP_INTERNAL_URL: ${MCP_INTERNAL_URL:-http://localhost:8000}
      RAASOA_MCP_DEFAULT_CLEARANCE: ${RAASOA_MCP_DEFAULT_CLEARANCE:-public}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # RAASOA scheduler — runs sync, queue, retention loops
  scheduler:
    build: .
    platform: linux/amd64
    image: raasoa:latest
    entrypoint: ["uv", "run", "python", "-m", "raasoa.worker.scheduler"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-raasoa}:${POSTGRES_PASSWORD:-raasoa_dev}@postgres:5432/${POSTGRES_DB:-raasoa}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-30}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-raasoa}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-raasoa_dev}
      S3_BUCKET: ${S3_BUCKET:-raasoa-artifacts}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      CHUNK_SIZE: ${CHUNK_SIZE:-512}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-80}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      QUALITY_GATE_ENABLED: ${QUALITY_GATE_ENABLED:-true}
      QUALITY_MIN_TEXT_LENGTH: ${QUALITY_MIN_TEXT_LENGTH:-50}
      QUALITY_PUBLISH_THRESHOLD: ${QUALITY_PUBLISH_THRESHOLD:-0.8}
      QUALITY_REVIEW_THRESHOLD: ${QUALITY_REVIEW_THRESHOLD:-0.5}
      QUALITY_MAX_TINY_CHUNK_RATIO: ${QUALITY_MAX_TINY_CHUNK_RATIO:-0.3}
      QUALITY_TINY_CHUNK_TOKENS: ${QUALITY_TINY_CHUNK_TOKENS:-20}
      CONFLICT_DETECTION_ENABLED: ${CONFLICT_DETECTION_ENABLED:-true}
      CONFLICT_SEMANTIC_THRESHOLD: ${CONFLICT_SEMANTIC_THRESHOLD:-0.15}
      CONFLICT_OVERLAP_THRESHOLD: ${CONFLICT_OVERLAP_THRESHOLD:-0.3}
      CLAIM_EXTRACTION_ENABLED: ${CLAIM_EXTRACTION_ENABLED:-true}
      CLAIM_EXTRACTION_PASSES: ${CLAIM_EXTRACTION_PASSES:-1}
      LLM_JUDGE_ENABLED: ${LLM_JUDGE_ENABLED:-true}
      LLM_JUDGE_AUTO_RESOLVE_THRESHOLD: ${LLM_JUDGE_AUTO_RESOLVE_THRESHOLD:-0.85}
      LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL:-}
      RERANKER: ${RERANKER:-passthrough}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCHEDULER_SYNC_INTERVAL: ${SCHEDULER_SYNC_INTERVAL:-60}
      SCHEDULER_QUEUE_INTERVAL: ${SCHEDULER_QUEUE_INTERVAL:-30}
      SCHEDULER_RETENTION_INTERVAL: ${SCHEDULER_RETENTION_INTERVAL:-21600}
    depends_on:
      api:
        condition: service_healthy
    # The scheduler is not an HTTP server, so the image's curl-based
    # healthcheck would always fail. Disable it; liveness is visible in
    # the logs and `restart: unless-stopped` recovers real crashes.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  ollama_data:
